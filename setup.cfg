[flake8]
max-line-length = 79
ignore = E731

[pycodestyle]
max-line-length = 79
ignore = E731

[isort]
profile = black
line_length = 79

[coverage:run]
source = passportd
omit =
    */tests/*
    */test_*

[coverage:report]
precision = 2
show_missing = true
skip_covered = false

[coverage:xml]
output = coverage.xml
